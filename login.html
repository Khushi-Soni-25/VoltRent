<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — VoltRide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script>(function(){var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';document.head.appendChild(sc);})();</script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VoltRide">
<link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>
<nav class="navbar">
    <div class="nav-logo"><div class="dot"></div> VOLTRIDE</div>
    <div class="nav-right">
      <div class="theme-toggle" title="Switch theme">
        <button class="theme-btn active" id="tb-dark" onclick="setTheme('dark')" title="Dark">🌙</button>
        <button class="theme-btn" id="tb-light" onclick="setTheme('light')" title="Light">☀️</button>
        <button class="theme-btn" id="tb-ev" onclick="setTheme('ev')" title="EV Green">⚡</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="window.location.href='index.html'">← Home</button>
    </div>
  </nav>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-title">Welcome Back</div>
      <div class="auth-sub">Login to your VoltRide account</div>
      <div id="login-alert" class="alert"></div>
      <div class="field">
        <label>Email Address</label>
        <input class="field-input" id="l-email" type="email" placeholder="you@email.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input class="field-input" id="l-pass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn btn-amber btn-full btn-lg mb-4" onclick="doLogin()">Login →</button>
      <hr class="divider">
      <div style="font-size:0.78rem;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;">Quick Demo Access</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button class="btn btn-surface btn-sm" onclick="dLogin('user')">👤 Demo User</button>
        <button class="btn btn-surface btn-sm" onclick="dLogin('dealer')">🏪 Demo Dealer</button>
        <button class="btn btn-surface btn-sm" onclick="dLogin('delivery')">🏍️ Demo Agent</button>
        <button class="btn btn-surface btn-sm" onclick="dLogin('admin')">🛡️ Admin</button>
      </div>
      <p style="text-align:center;margin-top:1.25rem;font-size:0.85rem;color:var(--text2);">
        No account? <a href="#" style="color:var(--amber);font-weight:700;" onclick="window.location.href='register.html'">Register here</a>
      </p>
    </div>
  </div>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
